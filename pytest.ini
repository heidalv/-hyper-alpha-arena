[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
# [2026-09-02] 挂死保护：此前 tests/unit 全量跑到 53% 永久挂死（两次复现同一位置），
# 整轮拿不到结果，等于没有回归防护网。Windows 下只有 thread 方法可用，超时会 dump
# 全部线程栈再终止进程——用途是暴露挂死点的调用栈以便根治，而非跳过继续跑。
# 个别确实慢的用例用 @pytest.mark.timeout(N) 单独放宽，不要调高全局值。
timeout = 120
timeout_method = thread
# 落库隔离（v6 1.6）：直连生产库的写测试默认 skip；
# 需要真实落库集成验证时：set PYTEST_ALLOW_DB_WRITE=1（见 tests/conftest.py）
markers =
    unit: Unit tests (fast, no DB/network)
    integration: Integration tests (may need DB)
    e2e: End-to-end tests (full stack)
    slow: Tests that take > 10s
