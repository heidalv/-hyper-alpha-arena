# AlphaArena 后端反代配置
# 服务器只跑后端(前端是 Electron 桌面应用,不在服务器托管)。
# Nginx 终结 TLS,反代 /api/* 和 /ws 到 gunicorn/uvicorn。

# 上游:gunicorn 多 worker(阶段5.2 跑 gunicorn -w 8)
upstream alpha_arena_backend {
    server 127.0.0.1:8000;
    # 多 worker 都监听同一端口(gunicorn 自己 fork),Nginx 只需指一个 upstream。
    keepalive 32;
}

server {
    listen 80;
    server_name api.yourdomain.com;
    # HTTP → HTTPS 重定向
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    # === TLS(Let's Encrypt,部署时用 certbot 生成真实路径) ===
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # === 安全头 ===
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # === CORS:桌面应用 Origin 白名单 ===
    # Electron 桌面应用的 Origin 是 file:// / app:// / tauri:// / 开发期 localhost
    # CORS 实际由后端 FastAPI 中间件管(FRONTEND_ORIGINS env),Nginx 透传即可。
    # 这里只加基本 CORS 头(后端会覆盖)。

    # 客户端上传/日志体限制
    client_max_body_size 20m;

    # === /api/* → 后端 ===
    location /api/ {
        proxy_pass http://alpha_arena_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";  # 配合 upstream keepalive
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # === /ws → WebSocket(关键:Upgrade/Connection 头) ===
    location /ws {
        proxy_pass http://alpha_arena_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WS 长连接:超时调长
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # === 健康检查端点(可选直连,不走 keepalive) ===
    location /api/health {
        proxy_pass http://alpha_arena_backend;
        access_log off;
    }

    # 根路径:服务器不托管前端,404(或返回简单 JSON 提示)
    location / {
        return 404 '{"detail": "API server. Frontend is a desktop app."}';
        add_header Content-Type application/json;
    }
}
