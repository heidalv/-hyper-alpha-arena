<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>按钮样式测试</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 bg-gray-100">
  <h1 class="text-2xl font-bold mb-6">交易对按钮样式测试</h1>
  
  <div class="bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-lg font-semibold mb-4">当前实现的样式（应该是高对比度蓝色）</h2>
    <div class="flex flex-wrap gap-2">
      <!-- 选中状态 - 应该是蓝色背景 -->
      <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap text-xs font-semibold transition-colors h-8 px-3 bg-blue-600 text-white shadow-md hover:bg-blue-700 border-2 border-blue-600 rounded-md">
        BTC (选中)
      </button>
      
      <!-- 未选中状态 - 灰色边框 -->
      <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap text-xs font-medium transition-colors h-8 px-3 border border-gray-300 bg-white hover:bg-gray-100 rounded-md">
        ETH (未选中)
      </button>
      
      <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap text-xs font-medium transition-colors h-8 px-3 border border-gray-300 bg-white hover:bg-gray-100 rounded-md">
        SOL (未选中)
      </button>
    </div>
  </div>
  
  <div class="bg-white p-6 rounded-lg shadow-md mt-6">
    <h2 class="text-lg font-semibold mb-4">对比：旧的低对比度样式</h2>
    <div class="flex flex-wrap gap-2">
      <!-- 旧的选中状态 - 黑色 -->
      <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap text-xs font-medium transition-colors h-8 px-3 bg-black text-white shadow hover:bg-gray-800 rounded-md">
        BTC (旧样式选中)
      </button>
      
      <!-- 未选中状态 -->
      <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap text-xs font-medium transition-colors h-8 px-3 border border-gray-300 bg-white hover:bg-gray-100 rounded-md">
        ETH (未选中)
      </button>
    </div>
  </div>

  <div class="mt-6 p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
    <p class="text-sm text-yellow-800">
      <strong>测试说明：</strong><br>
      - 上方的"BTC (选中)"应该显示为<strong>明亮的蓝色背景</strong>，白色粗体文字<br>
      - 下方的"BTC (旧样式选中)"显示为黑色背景，作为对比<br>
      - 如果上方也是黑色，说明样式没有正确应用
    </p>
  </div>
</body>
</html>
