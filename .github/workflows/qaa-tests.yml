name: qaa-tests

on:
  push:
    paths:
      - "qaa_architecture_package/**"
  pull_request:
    paths:
      - "qaa_architecture_package/**"

defaults:
  run:
    working-directory: qaa_architecture_package

jobs:
  test-jsonl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run JSONL test suite
        run: |
          python3 test_qaa_core.py
          python3 test_workflow_store_backends.py
          python3 test_phase_c.py
          python3 test_phase_d.py
          python3 test_phase_e.py
          python3 test_phase_f.py
          python3 test_phase_g.py

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qaa
          POSTGRES_PASSWORD: qaa
          POSTGRES_DB: qaa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qaa -d qaa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QAA_DATABASE_URL: postgresql://qaa:qaa@localhost:5432/qaa
      QAA_WORKFLOW_BACKEND: postgres
      QAA_CONTROL_PLANE_BACKEND: postgres
      QAA_SCHEDULER_BACKEND: postgres
      QAA_CROSSDOMAIN_BACKEND: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply migrations
        run: python3 scripts/migrate_workflow_pg.py
      - name: Run PostgreSQL integration tests
        run: |
          python3 test_workflow_store_backends.py -v
          python3 test_phase_g.py -v

  quality-gates:
    # R7-3：核心仓库质量门禁（backend/frontend-next/scripts 变更时触发）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backend deps
        run: pip install -r requirements.txt pytest pytest-cov
      - name: Config drift check (structural; CI has no real .env)
        run: python scripts/check_config_drift.py --verbose
      - name: Backend unit tests
        run: python -m pytest tests/backend/unit -q
      - name: Frontend deps
        run: |
          cd frontend-next
          npm install
      - name: Frontend typecheck (hard gate)
        run: |
          cd frontend-next
          npx tsc --noEmit
      - name: Frontend lint (advisory until legacy errors reach zero)
        run: |
          cd frontend-next
          npx eslint src --max-warnings=9999 || true
