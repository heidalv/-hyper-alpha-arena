# frontend-next/electron-builder.yml
appId: com.alphaarena.web
productName: AlphaArena
# version 默认读 package.json version; electron-updater 用它比对 latest.yml
files:
  - out/**/*
  - electron/**/*
  - package.json
directories:
  output: dist-electron
# 只打包简体中文与英文 locale，减少安装包体积
electronLanguages:
  - zh-CN
  - en-US
# Win/mac/Linux 目标
win:
  target: nsis
  # 避免 winCodeSign 在未开「开发人员模式」时因符号链接权限失败
  signAndEditExecutable: false
mac:
  target: dmg
linux:
  target: AppImage
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
# 自动更新源（electron-updater）。
# 打包时写入 app-update.yml 作兜底；运行时 Electron 会按登录页填写的
# 后端地址覆盖为 <backend>/arena-updates/（本机/Tailscale 均可）。
publish:
  provider: generic
  url: http://127.0.0.1:8000/arena-updates/
